    <circle cx="52" cy="52" r="19" fill="#2b2d33"/>
    <circle cx="178" cy="52" r="19" fill="#2b2d33"/>
    <circle cx="52" cy="115" r="19" fill="#2b2d33"/>
    <circle cx="178" cy="115" r="19" fill="#2b2d33"/>
